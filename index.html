<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto Number Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Lotto Number Generator</h1>
            <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">
                Dark mode
            </button>
        </div>
        <div class="number-container">
        </div>
        <button id="generate-btn">Generate Numbers</button>
        <section class="form-section" aria-labelledby="partner-title">
            <h2 id="partner-title">Partnership Inquiry</h2>
            <p class="form-subtitle">Tell us about your proposal. We'll get back within 2 business days.</p>
            <form class="partner-form" action="https://formspree.io/f/mpqjoqlk" method="POST">
                <label class="field">
                    <span>Name</span>
                    <input type="text" name="name" placeholder="Jane Kim" required>
                </label>
                <label class="field">
                    <span>Email</span>
                    <input type="email" name="email" placeholder="jane@company.com" required>
                </label>
                <label class="field">
                    <span>Company</span>
                    <input type="text" name="company" placeholder="Acme Labs">
                </label>
                <label class="field">
                    <span>Message</span>
                    <textarea name="message" rows="4" placeholder="Briefly describe the partnership idea." required></textarea>
                </label>
                <button class="submit-btn" type="submit">Send Inquiry</button>
            </form>
        </section>
    </div>
    <footer>
        <p>&copy; 2023 Lotto Number Generator</p>
    </footer>
    <section class="comments-section" aria-labelledby="comments-title">
        <h2 id="comments-title">Comments</h2>
        <div id="disqus_thread"></div>
        <script>
            /*
            var disqus_config = function () {
            this.page.url = PAGE_URL;
            this.page.identifier = PAGE_IDENTIFIER;
            };
            */
            (function() {
                var d = document, s = d.createElement('script');
                s.src = 'https://productbuilder1-4.disqus.com/embed.js';
                s.setAttribute('data-timestamp', +new Date());
                (d.head || d.body).appendChild(s);
            })();
        </script>
        <noscript>Please enable JavaScript to view the comments powered by Disqus.</noscript>
    </section>
    <script src="main.js"></script>
</body>
</html>
